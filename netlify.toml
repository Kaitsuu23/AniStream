[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["scraper/**", "routes/**", "public/**"]

# Serve static assets directly from publish dir (css, js, img)
# Everything else goes to the Express function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[build.environment]
  NODE_VERSION = "20"
